<script>
(function () {
  var loading = document.getElementById("detailLoading");
  if (!loading) return;
  var observer = new MutationObserver(function () {
    var content = document.getElementById("detailContent");
    if (content && content.innerHTML.trim().length > 0) {
      loading.style.display = "none";
      observer.disconnect();
    }
  });
  observer.observe(document.getElementById("detailContent"), { childList: true });
  setTimeout(function () { loading.style.display = "none"; observer.disconnect(); }, 16000);
})();
</script>
